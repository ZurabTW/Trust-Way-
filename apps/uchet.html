<title>Trust Way Учёт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one working column (max 1040px). Deals are the centre: a list, then one deal page with its stages, quick money buttons and history. Owner adds Summary, Cash and Settings. */
:root {
  --bg: #f1f3f8;
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --fg: #131830;
  --muted: #5b6383;
  --line: #d8dcea;
  --accent: #26369a;
  --accent-ink: #ffffff;
  --accent-soft: #e3e7f8;
  --pos: #1c7448;
  --neg: #b3261e;
  --warn: #8f5a00;
  --font: "Segoe UI", system-ui, -apple-system, "PingFang SC", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1020; --surface: #161a2e; --surface-2: #1b2036; --fg: #e8eaf4; --muted: #9aa1c2;
    --line: #2a3050; --accent: #9aa6ff; --accent-ink: #0d1020; --accent-soft: #232a4d;
    --pos: #5ccb8f; --neg: #ff8a80; --warn: #f2b85b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1020; --surface: #161a2e; --surface-2: #1b2036; --fg: #e8eaf4; --muted: #9aa1c2;
  --line: #2a3050; --accent: #9aa6ff; --accent-ink: #0d1020; --accent-soft: #232a4d;
  --pos: #5ccb8f; --neg: #ff8a80; --warn: #f2b85b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 16px 56px;
  font-variant-numeric: tabular-nums;
}
.app { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 14px; }
.role { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 9px 16px; border-radius: 9px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, .deal:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.notice { padding: 11px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.notice.warn { border-color: var(--warn); color: var(--fg); }
.gate { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; display: grid; gap: 8px; max-width: 560px; }
.gate h2 { margin: 0; font-size: 19px; }
.gate p { margin: 0; color: var(--muted); }

.panel { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 17px; font-weight: 650; text-wrap: balance; }
.card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.pos { color: var(--pos); }
.neg { color: var(--neg); }

/* buttons */
.btn { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); }
.btn.small { padding: 6px 12px; font-size: 13.5px; font-weight: 500; }
.btn.danger { border-color: var(--neg); color: var(--neg); background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.link { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; text-align: left; }

.actions { display: grid; gap: 12px; }
.agroup { display: grid; gap: 6px; }
.abtns { display: flex; gap: 6px; flex-wrap: wrap; }
.abtn { font: inherit; font-size: 14px; font-weight: 500; padding: 9px 13px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.abtn.hint { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* checklist */
.key { display: inline-block; font-size: 12.5px; margin-right: 10px; }

.check input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }
.key.done { color: var(--pos); } .key.due { color: var(--warn); } .key.later { color: var(--muted); }

.cl { display: grid; gap: 10px; }
.cl-group { display: grid; gap: 6px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
.cl-group.now { border-color: var(--accent); background: var(--accent-soft); }

.cl-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); border-left-width: 5px; }
.cl-mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; border: 1.5px solid var(--line); color: var(--muted); }
.cl-main { display: grid; gap: 1px; min-width: 0; }
.cl-t { font-weight: 600; }
.cl-d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.cl-row.st-done, .cl-row.st-part { border-color: color-mix(in srgb, var(--pos) 45%, var(--line)); border-left-color: var(--pos); }
.cl-row.st-done .cl-mark, .cl-row.st-part .cl-mark { background: var(--pos); border-color: var(--pos); color: var(--surface); }
.cl-row.st-due { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.cl-row.st-due .cl-mark { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.cl-row.st-opt { border-style: dashed; border-left-style: solid; border-left-color: var(--line); }
.cl-row.st-later { opacity: .72; border-left-color: var(--line); }
.cl-form { margin: 2px 0 6px; }
.cl-ents { display: grid; gap: 2px; margin-top: 4px; }
.cl-ent { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); padding: 3px 0; border-top: 1px dashed var(--line); }
.cl-ent b { color: var(--fg); font-weight: 600; }
.cl-ent.on { color: var(--accent); }
.cl-ent .link { flex: none; }
.cl-st { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.sub-block h3 { margin: 0; }

.calc-box:empty { display: none; }
.sec { border-top-width: 5px; }
.sec-goods { border-top-color: var(--accent); }

.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font-size: 19px; }

@media (max-width: 420px) { .stats { grid-template-columns: 1fr 1fr; } .stat.main { grid-column: 1 / -1; } }
.deal.ok { border-left: 5px solid var(--pos); }
.deal.todo { border-left: 5px solid var(--warn); }
.flag { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.flag.ok { color: var(--pos); background: color-mix(in srgb, var(--pos) 12%, transparent); }
.flag.todo { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* form */
.form { display: grid; gap: 12px; padding: 14px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--surface); }
.form-head { display: flex; align-items: baseline; gap: 8px; }
.form-head b { font-size: 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.f { display: grid; gap: 5px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }

.hint-t { font-size: 12.5px; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 16px; width: 100%; min-width: 0; padding: 9px 11px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg); }
input[type="file"] { padding: 7px; font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { font: inherit; font-size: 13.5px; padding: 7px 11px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }

.amount { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.curs { display: flex; gap: 4px; flex-wrap: wrap; }
.curs button { font: inherit; font-weight: 600; font-size: 14px; min-width: 52px; padding: 8px 10px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.curs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.conv { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.conv .eq { padding-bottom: 10px; color: var(--muted); }
.ok { color: var(--pos); font-weight: 500; }
.err { color: var(--neg); font-weight: 500; }

/* stepper */
.stepper { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.stepper::-webkit-scrollbar { display: none; }
.step { flex: none; font: inherit; font-size: 13px; font-weight: 500; padding: 7px 11px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; white-space: nowrap; }
.step.past { color: var(--fg); border-color: var(--line); background: var(--accent-soft); }
.step.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.progress { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.progress i { height: 4px; border-radius: 2px; background: var(--line); }
.progress i.on { background: var(--accent); }

/* KPIs */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr)); }
@media (max-width: 420px) { .kpi .v { font-size: 20px; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; display: grid; gap: 2px; min-width: 0; }
.kpi .k { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.kpi .x { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.kpi.main { border-color: var(--accent); border-width: 1.5px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 650; border-top: 1.5px solid var(--line); }
.empty { color: var(--muted); padding: 16px 4px; text-align: center; }
.bar { height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; }

/* deals */
.deals { display: grid; gap: 8px; }
.deal { display: grid; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.deal:hover { border-color: var(--accent); }
.deal-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.deal-head b { font-weight: 650; font-size: 15.5px; }
.what { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.stage { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.stage.done { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 600; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { width: auto; font-size: 14px; padding: 7px 10px; }
.filters input { flex: 1; min-width: 160px; }

/* history */
.hist { display: grid; }
.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.hrow:last-child { border-bottom: 0; }
.hdate { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; min-width: 58px; }
.hmain { min-width: 0; display: grid; gap: 2px; }
.hmain .t { font-weight: 550; }
.hmain .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.hamt { text-align: right; white-space: nowrap; display: grid; gap: 2px; justify-items: end; }
.hamt .c { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.receipt { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--accent); text-decoration: none; margin-top: 4px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.xgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.xside { display: grid; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); align-content: start; }
.xside input, .xside select { background: var(--surface); }
tr.grp td { padding-top: 14px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .tab, .abtn, .chip-btn, .curs button, .step, .deal { transition: background .12s, border-color .12s, color .12s; } }
</style>

  <div class="top">
    <div class="brand"><h1>Trust Way · Учёт</h1><span id="who-am-i"></span></div>
    <span class="role" id="role" hidden></span>
  </div>

  <main id="main"><div class="gate"><h2>Загрузка…</h2><p>Подключаюсь к базе учёта.</p></div></main>

<script>
/* ================================================================== */
/*  Справочники процесса                                               */
/* ================================================================== */
/* Сделку заводят, когда клиент согласился и оплатил — этапа «Заявка» в учёте нет (заявки живут в amoCRM) */
const STAGES = [
  ["payment", "Оплата"], ["buyout", "Выкуп"], ["warehouse", "Склад TW"],
  ["transit", "В пути в Москву"], ["moscow", "Москва"], ["done", "Выдан клиенту"]
];
const STAGE_IDX = Object.fromEntries(STAGES.map(([id], i) => [id, i]));
const STAGE_NAME = Object.fromEntries(STAGES);
STAGE_NAME.cancelled = "Отменена";

const CATS = {
  charge: ["Товар", "Образец", "Доставка до Москвы", "Расходы по Москве"],
  income: ["Товар · депозит", "Товар · доплата", "Товар · полная оплата", "Доставка · предоплата", "Доставка · доплата", "Доставка · полная оплата", "Расходы по Москве"],
  expense: ["Выкуп товара", "Образец", "Возврат от поставщика", "Компенсация клиенту за брак", "Прочее по товару", "Логистика по Китаю", "Упаковка", "Доставка в Москву", "Расходы по Москве", "Прочее по сделке"],
  plan: ["Сумма поставщика"],
  general: ["Зарплата и бонусы менеджеров", "Аренда офиса", "Офисные расходы", "Комиссии и обмен валюты", "Реклама", "Прочее"]
};
const PARTS = [["goods", "Товар"], ["delivery", "Доставка до Москвы"], ["moscow", "Расходы по Москве"]];
const PART_OF = { "Товар": "goods", "Образец": "goods", "Товар · депозит": "goods", "Товар · доплата": "goods", "Товар · полная оплата": "goods", "Доставка до Москвы": "delivery", "Доставка · предоплата": "delivery", "Доставка · доплата": "delivery", "Доставка · полная оплата": "delivery", "Расходы по Москве": "moscow" };
/* Эти варианты оплаты закрывают весь остаток счёта: сумма и курс связаны */
const FULL_CATS = ["Товар · полная оплата", "Товар · доплата", "Доставка · полная оплата", "Доставка · доплата", "Доставка до Москвы", "Расходы по Москве"];
/* Возврат от поставщика (недовложение) — деньги вернулись: уменьшает расход сделки */
const REFUND_CATS = ["Возврат от поставщика"];
const KIND_TITLE = { plan: "Сумма поставщика", charge: "Счёт клиенту", income: "Клиент оплатил", expense: "Расход по сделке", general: "Общий расход" };

/* Чек-лист сделки: что должно быть внесено к каждому этапу.
   optional — бывает не всегда (не горит оранжевым, если не внесено). */
const isPart = (kind, part) => e => e.kind === kind && PART_OF[e.cat] === part;
const isCat = cat => e => e.kind === "expense" && e.cat === cat;
const CHECKLIST = [
  /* Товар */
  /* Окончательное решение: сумма поставщика (без нашего процента) и сумма клиенту (с наценкой) — в одном пункте */
  { id: "sums", group: "goods", stage: "payment", sums: true, label: "Сумма поставщика и сумма клиенту", short: "суммы сделки", kind: "sums", match: e => e.kind === "plan" || (e.kind === "charge" && e.cat === "Товар") },

function debtText(m) {

/* Состояние каждого пункта чек-листа: done / part / due / opt / later */
function checklist(o, m) {
  const si = o.status === "cancelled" ? -1 : (STAGE_IDX[o.status] ?? -1);
  return CHECKLIST.map(c => {
    const ents = m.list.filter(c.match);
    const ci = STAGE_IDX[c.stage];
    const reached = si >= ci;
    const optional = c.optional && !(c.requiredIfCharged && m.parts[c.part].debt);
    let state = ents.length ? "done" : reached ? (optional ? "opt" : "due") : (optional ? "opt" : "later");
    let extra = "";
    if (c.part && ents.length) {
      const d = m.parts[c.part].debt;
      if (d && d.amount > (d.cur === "CNY" ? 1 : 0.5)) {
        extra = `осталось ${money(d.amount, d.cur, true)}`;
        state = si >= STAGE_IDX.moscow ? "due" : "part";
      } else if (d && d.amount < -(d.cur === "CNY" ? 1 : 0.5)) extra = `переплата ${money(-d.amount, d.cur, true)}`;
    }
    const by = {}; for (const e of ents) by[e.cur] = (by[e.cur] || 0) + e.amount;
    let sum = ents.length ? byCur(by) : "";
    if (c.sums) {
      const plan = ents.filter(e => e.kind === "plan"), cli = ents.filter(e => e.kind === "charge");
      const pc = plan.reduce((s2, e) => s2 + e.amount, 0), cb = {}; for (const e of cli) cb[e.cur] = (cb[e.cur] || 0) + e.amount;
      const cliCny = cli.reduce((s2, e) => s2 + (e.cny || 0), 0);
      sum = [plan.length ? `поставщик ${money(pc, "CNY")}` : "", cli.length ? `клиенту ${byCur(cb)}` : "", plan.length && cli.length ? `наценка ${money(cliCny - pc, "CNY", true)}` : ""].filter(Boolean).join(" · ");
      const miss = [!plan.length ? "нет суммы поставщика" : "", !cli.length ? "нет суммы клиенту" : ""].filter(Boolean);
      if (ents.length && miss.length) { state = "due"; extra = miss.join(", "); }
    }
    if (c.id === "supplier" && m.planCny > 0) {
      const paidSup = m.exp["Выкуп товара"]?.cny || 0, left = m.planCny - paidSup;
      if (ents.length && left > 1) { extra = `оплачено ${money(paidSup, "CNY", true)} из ${money(m.planCny, "CNY", true)} · осталось ${money(left, "CNY", true)}`; state = si >= STAGE_IDX.warehouse ? "due" : "part"; }
    }
    if (c.id === "goodsExtra" && ents.length) {
      const ex = {}, bl = {}, rf = {};
      for (const e of ents) { const t = e.kind === "charge" ? bl : REFUND_CATS.includes(e.cat) ? rf : ex; t[e.cur] = (t[e.cur] || 0) + e.amount; }
      sum = [Object.keys(ex).length ? `расход ${byCur(ex)}` : "", Object.keys(rf).length ? `возврат от поставщика ${byCur(rf)}` : "", Object.keys(bl).length ? `выставлено клиенту ${byCur(bl)}` : Object.keys(ex).length ? "за наш счёт" : ""].filter(Boolean).join(" · ");
    }
    if (c.id === "msk" && ents.length) {
      const ex = {}, bl = {};
      for (const e of ents) { const t = e.kind === "charge" ? bl : ex; t[e.cur] = (t[e.cur] || 0) + e.amount; }
      sum = [Object.keys(ex).length ? `расход ${byCur(ex)}` : "", Object.keys(bl).length ? `платит клиент ${byCur(bl)}` : "за наш счёт"].filter(Boolean).join(" · ");
    }
    if (c.combo) {
      /* Доставка: расход перевозчика, счёт клиенту и оплата клиента — в одном окне */
      const car = {}, cli = {}, pay = {};
      for (const e of ents) { const t = e.kind === "charge" ? cli : e.kind === "income" ? pay : car; t[e.cur] = (t[e.cur] || 0) + e.amount; }
      const hasCar = Object.keys(car).length > 0, hasCli = Object.keys(cli).length > 0, hasPay = Object.keys(pay).length > 0;
      const d = m.parts.delivery.debt, left = d && d.amount > (d.cur === "CNY" ? 1 : 0.5);
      sum = [hasCar ? `перевозчик ${byCur(car)}` : "", hasCli ? `клиенту ${byCur(cli)}` : "", hasPay ? `оплачено ${byCur(pay)}` : ""].filter(Boolean).join(" · ");
      const miss = [!hasCar ? "нет расхода перевозчика" : "", !hasCli ? "нет счёта клиенту" : "", hasCli && !hasPay ? "клиент не оплатил" : "", hasPay && left ? `осталось ${money(d.amount, d.cur, true)}` : ""].filter(Boolean);
      if (!miss.length && ents.length) state = "done";
      else if (ents.length) { state = reached ? "due" : "part"; extra = miss.join(", "); }
    }
    return { ...c, ents, state, extra, sum, current: ci === si, hasReceipt: ents.some(e => e.receipt) };

}
/* Расчёт заработка на доставке для формы «Доставка до Москвы» */
function comboCalc(f, m) {
  const cur = f.cur, rate = cur === "CNY" ? 1 : num(f.rate);
  const car = num(f.carrier), cli = num(f.client);
  const toC = v => toCny(v, cur, rate), fromC = v => cur === "CNY" ? v : cur === "RUB" ? v * rate : v / rate;
  const china = (m.exp["Логистика по Китаю"]?.cny || 0) + (m.exp["Упаковка"]?.cny || 0);
  const prevCar = m.exp["Доставка в Москву"]?.cny || 0, prevCli = m.parts.delivery.chargeCny || 0;
  const lines = [];
  if (china > 0) lines.push(`Уже потратили на логистику по Китаю и упаковку: ${money(china, "CNY", true)}${rate > 0 && cur !== "CNY" ? ` (≈ ${money(fromC(china), cur, true)})` : ""}.`);
  if (car > 0 && rate > 0) {
    const min = fromC(toC(car) + china + prevCar - prevCli);
    lines.push(`Чтобы не уйти в минус, клиенту нужно выставить не меньше ${money(Math.max(0, min), cur, true)}.`);
  }
  if (car > 0 && cli > 0) lines.push(`Наценка к счёту перевозчика: <b>${money(cli - car, cur)}</b>.`);
  if (cli > 0 && rate > 0) {
    const earnC = toC(cli) + prevCli - (car > 0 ? toC(car) : 0) - prevCar - china;
    lines.push(`<b class="${earnC >= 0 ? "pos" : "neg"}">Заработаем на доставке: ${money(fromC(earnC), cur, true)}</b>${cur !== "CNY" ? ` <span class="muted">(≈ ${money(earnC, "CNY", true)})</span>` : ""} — когда клиент оплатит счёт.`);
  }
  if (cur !== "CNY" && rate > 0 && china > 0) lines.push(`<span class="muted">Юани пересчитаны по текущему курсу: ${inNum(rate, 4)} ${rateUnit(cur)}.</span>`);
  return lines.join("<br>");
}
function missingOf(o, m) { return checklist(o, m).filter(r => r.state === "due").map(r => r.short || r.label.toLowerCase()); }
function byCur(obj) { const parts = CUR_ORDER.filter(c => obj[c]).map(c => money(obj[c], c)); return parts.length ? parts.join(" + ") : "—"; }
function canEditEntry(e) {
  if (S.isOwner) return true;
  return e.createdBy === S.myId && (Date.now() - (e.createdAt || 0)) < EDIT_DAYS * 864e5;
}

async function boot() {
  const ns = window.claude;
  if (!ns || typeof ns.use !== "function") { gate("Откройте страницу в Claude", "Учёт работает внутри Claude, когда вы вошли в свой аккаунт."); return; }
  const [db, user, assets] = await Promise.all([ns.use("db"), ns.use("user"), ns.use("assets")]);
  if (!db) { gate("Нет доступа к базе", "Войдите в аккаунт Claude и откройте ссылку снова. Если вы менеджер, попросите владельца выдать вам доступ к этой странице."); return; }
  S.db = db; S.user = user; S.assets = assets;
  S.isOwner = (await user?.isOwner()) ?? false;
  S.myId = (await user?.id()) ?? null;
  if (!S.myId) { gate("Не удалось определить пользователя", "Войдите в аккаунт Claude и откройте ссылку снова."); return; }

  const me = await user.me();
  document.getElementById("who-am-i").textContent = me.name || "";
  const role = document.getElementById("role"); role.hidden = false; role.textContent = S.isOwner ? "Владелец" : "Менеджер";

  try {
    const ref = db.doc("deals/" + S.myId);
    const snap = await ref.get();
    if (!snap.exists) await ref.set({ joinedAt: Date.now() });
  } catch (e) {
    if (!S.isOwner) { gate("Доступ только на просмотр", "Чтобы вести сделки, попросите владельца выдать вам доступ с правом вносить изменения."); return; }
  }

  const timer = setTimeout(() => { if (!S.loaded) setStatus("База пока не отвечает. Данные могут быть неполными, проверьте интернет.", true); }, 10000);
  const onErr = e => { clearTimeout(timer); setStatus(e?.code === "revoked" ? "Доступ к странице изменился. Обновите её." : "Не удалось загрузить часть данных. Обновите страницу.", true); };
  const loaded = meta => { if (!meta.fromCache && !S.loaded) { S.loaded = true; clearTimeout(timer); setStatus(""); } };

  const watched = new Set();
  const watchUid = uid => {
    if (watched.has(uid)) return; watched.add(uid);
    db.collection(`deals/${uid}/orders`).onSnapshot(snap => { S.orders.set(uid, snap.docs.map(d => { const x = { id: d.id, ...d.data() }; if (x.status === "request") x.status = "payment"; return x; })); loaded(snap.metadata); render(); }, onErr);
    db.collection(`deals/${uid}/entries`).onSnapshot(snap => { S.entries.set(uid, snap.docs.map(d => ({ id: d.id, ...d.data() }))); render(); }, onErr);
    /* Переводы денег из России в Китай: пока менеджер не перевёл, это его долг перед Trust Way */
    db.collection(`deals/${uid}/transfers`).onSnapshot(snap => { S.transfers.set(uid, snap.docs.map(d => ({ id: d.id, ...d.data() }))); render(); }, onErr);
  };
  watchUid(S.myId);

  db.doc("rates/current").onSnapshot(snap => { S.rates = snap.exists ? { ...snap.data() } : {}; render(); }, onErr);

  if (S.isOwner) {
    db.collection("deals").onSnapshot(snap => {
      S.dealUids = snap.docs.map(d => d.id);
      if (!S.dealUids.includes(S.myId)) S.dealUids.push(S.myId);
      S.dealUids.forEach(watchUid);
      refreshNames(); render();
    }, onErr);
    db.collection("company/main/general").onSnapshot(snap => { S.general = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onErr);
    db.collection("company/main/exchanges").onSnapshot(snap => { S.exchanges = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onErr);
    db.collection("bonus").onSnapshot(snap => { S.bonus = Object.fromEntries(snap.docs.map(d => [d.id, d.data().percent])); render(); }, onErr);
  } else {
    S.dealUids = [S.myId];
    db.doc("bonus/" + S.myId).onSnapshot(snap => { S.bonus = { [S.myId]: snap.exists ? snap.data().percent : null }; render(); }, () => {});
  }

  S.tab = "deals";
  buildTabs(); bindEvents(); render(true);
}
async function refreshNames() {
  if (!S.user) return;
  const ps = await S.user.profiles(S.dealUids);
  S.names = Object.fromEntries(Object.entries(ps).map(([id, p]) => [id, p.name || ""]));
  render();
}

let queued = false, forceNext = false, blurWait = false;
function render(force) {
  if (!S.db || !S.tab) return;
  if (force) forceNext = true;
  if (queued) return; queued = true;
  requestAnimationFrame(() => { queued = false; const f = forceNext; forceNext = false; draw(f); });
}
function draw(force) {
  const main = document.getElementById("main");
  const a = document.activeElement;
  if (!force && a && main.contains(a) && a.matches("input, textarea")) {
    if (!blurWait) { blurWait = true; a.addEventListener("blur", () => { blurWait = false; render(); }, { once: true }); }
    return;
  }
  const y = window.scrollY;
  let html = "";
  if (S.tab === "deals") html = S.open ? dealPage() : dealsList();
  else if (S.tab === "summary") html = summaryPage();
  else if (S.tab === "mine") html = minePage();
  else if (S.tab === "cash") html = S.isOwner ? cashPage() : mgrCashPage();
  else if (S.tab === "settings") html = settingsPage();
  main.innerHTML = html;
  const now = main.querySelector(".step.now"), st = now?.parentElement;
  if (st) st.scrollLeft = Math.max(0, now.offsetLeft - st.offsetLeft - 24);
  if (!force) window.scrollTo(0, y);
}

/* ---------- окно «Доставка до Москвы»: перевозчик + счёт клиенту + оплата клиента ---------- */
function comboRate(f) { return f.cur === "CNY" ? 1 : (num(f.rate) > 0 ? num(f.rate) : curRate(f.cur)); }
/* Счёт клиенту за доставку с учётом суммы, которую вписывают прямо сейчас */
function comboInv(f, m) {
  const charges = m.list.filter(e => e.kind === "charge" && PART_OF[e.cat] === "delivery");
  const cli = num(f.client);
  const curs = new Set(charges.map(e => e.cur)); if (cli > 0) curs.add(f.cur);
  if (curs.size !== 1) return null;
  const cur = [...curs][0];
  let total = charges.reduce((s, e) => s + e.amount, 0), totC = charges.reduce((s, e) => s + (e.cny || 0), 0);
  if (cli > 0) { total += cli; totC += toCny(cli, f.cur, comboRate(f)); }
  const k = total > 0 ? totC / total : 0;
  const paid = m.list.filter(e => e.kind === "income" && PART_OF[e.cat] === "delivery").reduce((s, e) => s + appliedOf(e, cur, k), 0);

async function saveCombo() {
  const f = S.form;

  const m = dealMoney(f.uid, f.orderId);
  const car = num(f.carrier), cli = num(f.client), payA = num(f.payAmount);
  const doPay = f.payOn && payA > 0;
  if (!(car > 0) && !(cli > 0) && !doPay) return fail("Впишите хотя бы одну сумму.");
  const rate = comboRate(f);
  if ((car > 0 || cli > 0) && !(rate > 0)) return fail(`Укажите курс ${CUR[f.cur]} один раз — он нужен для пересчёта в юани.`);
  if (!f.date) return fail("Укажите дату.");
  /* оплата клиента: считаем до записи, по счёту вместе с суммой из этого окна */
  let payBody = null;
  if (doPay) {
    const pf = payForm(f, m);
    if (!pf.inv) return fail("Сначала укажите счёт клиенту — от него считается оплата.");
    const cross = crossNeeded(pf);
    if (cross && !(num(f.payXr) > 0)) return fail("Укажите курс, по которому клиент платит.");
    const applied = cross ? toApplied(pf, payA) : payA;
    let pr = 1, pc = payA;
    if (f.payCur !== "CNY") { pr = curRate(f.payCur); pc = pr > 0 ? toCny(payA, f.payCur, pr) : applied * pf.inv.k; if (!(pr > 0)) pr = rateFrom(payA, f.payCur, pc); }
    payBody = { kind: "income", cat: f.payCat, amount: r2(payA), cur: f.payCur, rate: +pr.toFixed(6), cny: r2(pc), method: f.payMethod, applied: r2(applied), applyCur: pf.inv.cur, receipt: null, receiptType: null };
  }
  const btn = document.getElementById("f-save"); if (btn) btn.disabled = true;
  try {
    let receipt = null, receiptType = null;
    if (f.file && S.assets && car > 0) {
      try { const up = await S.assets.upload(f.file); receipt = up.id; receiptType = up.contentType; }
      catch (err) { if (btn) btn.disabled = false; return fail(err?.code === "unsupported_type" ? "Такой формат не поддерживается. Прикрепите JPG, PNG или PDF." : "Файл не загрузился. Попробуйте ещё раз или сохраните без него."); }
    }
    const col = S.db.collection(`deals/${f.uid}/entries`);
    const base = { orderId: f.orderId, date: f.date, note: f.note.trim().slice(0, 300), createdBy: S.myId, createdAt: Date.now(), updatedAt: Date.now() };
    if (car > 0) await col.doc().set({ ...base, kind: "expense", cat: "Доставка в Москву", amount: r2(car), cur: f.cur, rate: +rate.toFixed(6), cny: r2(toCny(car, f.cur, rate)), method: f.method, receipt, receiptType });
    if (cli > 0) await col.doc().set({ ...base, kind: "charge", cat: "Доставка до Москвы", amount: r2(cli), cur: f.cur, rate: +rate.toFixed(6), cny: r2(toCny(cli, f.cur, rate)), method: null, receipt: null, receiptType: null });
    if (payBody) await col.doc().set({ ...base, ...payBody });
    const parts = [car > 0 ? `перевозчик ${money(car, f.cur)}` : "", cli > 0 ? `клиенту ${money(cli, f.cur)}` : "", payBody ? `оплата ${money(payA, f.payCur)}` : ""].filter(Boolean).join(", ");
    S.form = null; S.msg = { where: "entry", cls: "ok", text: `Сохранено: доставка до Москвы — ${parts}` }; render(true);
  } catch (err) { fail("Не сохранилось. Проверьте интернет и попробуйте ещё раз."); }
  finally { const b2 = document.getElementById("f-save"); if (b2) b2.disabled = false; }
}

      S.msg = null; S.pending = null; render(true);
      setTimeout(() => document.getElementById("fc-carrier")?.focus(), 30);
      return;
    }
    let cat = a.cat || STAGE_DEFAULT_CAT[a.kind]?.[o.status] || CATS[a.kind][0];
    if (a.id === "payGoods") { const m = dealMoney(S.open.uid, S.open.id); const g = m.parts.goods; if (g.paidCny > 0) cat = "Товар · доплата"; else if (g.chargeCny > 0 && o.status !== "payment" && o.status !== "request") cat = "Товар · полная оплата"; }
    if (a.id === "payDelivery") { const d = dealMoney(S.open.uid, S.open.id).parts.delivery; if (d.paidCny > 0) cat = "Доставка · доплата"; }
    /* Счёт за доставку до Москвы выставляется в долларах */
    const cur = a.cur || (a.kind === "charge" && cat === "Доставка до Москвы" ? "USD" : undefined);
    openForm("deal", a.kind, cat, { action: a.id, uid: S.open.uid, orderId: S.open.id, ...(cur ? { cur } : {}) });
    /* Расходы по Москве платим рублями в Москве */
    if (a.kind === "expense" && cat === MSK) S.form.method = "Наличные ₽ · Москва";
    if (a.id === "chargeMsk") { const by = dealMoney(S.open.uid, S.open.id).exp[MSK]?.by || {}; if (by.RUB > 0) S.form.amount = inNum(r2(by.RUB), 2); }
    /* Оплата клиента: валюта по умолчанию — валюта счёта, остаток долга подставляется.
       Депозит за товар не подставляем — его сумму вписывают сами. */
    if (a.kind === "income") {
      const f = S.form; const list = orderEntries(S.open.uid, S.open.id);
      f.inv = invoiceOf(list, PART_OF[cat] || "goods");
      if (f.inv) {
        f.cur = f.inv.cur;
        prefillPayment(f); /* полная оплата и доплата подставляют остаток; депозит и предоплату вписывают сами */
      }
    }
    S.pending = null; render(true);
    setTimeout(() => document.getElementById("f-amount")?.focus(), 30);
  },
  "open-general": () => { openForm("general", "general", CATS.general[0], { action: "general" }); render(true); setTimeout(() => document.getElementById("f-amount")?.focus(), 30); },
  "close-form": () => { S.form = null; S.pending = null; render(true); },
  "f-cat": (b, v) => {
    const f = S.form; f.cat = v;
    if (f.kind === "charge" && v === "Доставка до Москвы" && !f.amount && f.cur !== "USD") { f.cur = "USD"; f.rate = inNum(curRate("USD")); f.driver = "rate"; f.cny = ""; }
    /* Расходы по Москве — только рубли */
    if ((f.kind === "expense" || f.kind === "charge") && v === MSK && f.cur !== "RUB" && f.mode !== "edit") {
      f.cur = "RUB"; f.rate = inNum(curRate("RUB")); f.driver = "rate"; f.cny = ""; f.rateOpen = false;
      if (f.kind === "expense") f.method = "Наличные ₽ · Москва";
    }
    if (f.bill && !f.billTouched) setBill(f);
    if (f.kind === "income" && f.ctx === "deal") {
      const before = f.inv?.part;
      f.inv = invoiceOf(orderEntries(f.uid, f.orderId), PART_OF[v] || "goods", f.mode === "edit" ? f.id : null);
      if (f.inv && f.inv.part !== before && f.mode !== "edit") f.cur = f.inv.cur;
      if (f.inv) {
        const wasFull = f.full;
        f.full = FULL_CATS.includes(v) && f.inv.remaining > 0.005;
        if (crossNeeded(f) && !f.xr) f.xr = inNum(defaultXr(f), 4);
        if (f.mode !== "edit" && (f.inv.part !== before || f.full !== wasFull)) { if (f.full) prefillPayment(f); else if (wasFull) f.amount = ""; }
      }
    }
    render(true);
  },
  "f-cur": (b, v) => {
    const f = S.form; f.cur = v; f.rate = inNum(curRate(v)); f.driver = "rate"; if (v === "CNY") f.cny = "";
    /* Оплата клиента: способ по умолчанию под валюту (его можно поменять, список тот же, что и за товар) */
    if (f.kind === "income") {
      const auto = { USDT: "USDT на кошелёк · Россия", CNY: "Юани (Alipay / WeChat)" };
      const autoVals = ["Наличные · офис TW", ...Object.values(auto)];
      if (!f.method || autoVals.includes(f.method)) f.method = auto[v] || "Наличные · офис TW";
    }
    if (f.kind === "income" && f.inv) prefillPayment(f);
    render(true); recalc(null);
  },
  "f-drop-receipt": () => { S.form.receipt = null; S.form.receiptType = null; render(true); },
  "edit-entry": (b) => {
    const [uid, id] = b.dataset.key.split("/");
    const ctx = b.dataset.ctx;
    const e = ctx === "general" ? S.general.find(g => g.id === id) : (S.entries.get(uid) || []).find(x => x.id === id);
    if (!e) return;
    const kind = ctx === "general" ? "general" : e.kind;
    S.form = { ctx: ctx === "general" ? "general" : "deal", mode: "edit", id, uid, orderId: e.orderId, kind, cat: e.cat, cur: e.cur, amount: inNum(e.amount, 2), rate: inNum(e.rate, 6), cny: inNum(e.cny, 2), driver: "rate", date: e.date, method: e.method || "", note: e.note || "", receipt: e.receipt || null, receiptType: e.receiptType || null, file: null };
    if (kind === "income" && ctx !== "general") {
      const f = S.form;
      f.inv = invoiceOf(orderEntries(uid, e.orderId), PART_OF[e.cat] || "goods", id);
      if (f.inv && crossNeeded(f)) {
        const ap = isFinite(e.applied) && e.applyCur === f.inv.cur ? e.applied : null;
        f.xr = ap > 0 ? inNum(f.inv.cur === crossPair(f).big ? e.amount / ap : ap / e.amount, 4) : inNum(defaultXr(f), 4);
      }
    }
    S.pending = null; S.msg = null;
    if (ctx === "general") { S.tab = "cash"; S.open = null; }
    else { S.tab = "deals"; S.open = { uid, id: e.orderId }; }
    buildTabs(); render(true);
    setTimeout(() => document.querySelector("[data-form='entry']")?.scrollIntoView({ block: "center" }), 30);
  },
  "delete-entry": deleteEntry,
  "x-cur": (b, v) => { const x = S.xform; x[b.dataset.side + "Cur"] = v; xMirror(x); xRecalcHolder(x); render(true); },
  "x-preset": (b, v) => { S.xform = newXform(v); S.msg = null; render(true); setTimeout(() => document.getElementById("x-from")?.focus(), 30); },
  /* Кнопка у кошелька: подставить весь остаток и маршрут в Китай (или в юани с китайского USDT) */
  "x-send": (b, v) => {
    const by = walletBalances()[v] || {};
    const cur = Object.entries(by).filter(([c, a]) => a > 0.005 && (WALLET[v].curs.includes(c) || v === "other")).sort((p, q) => q[1] - p[1])[0]?.[0] || WALLET[v].curs[0];
    const x = newXform(v === "cn_usdt" ? "cny" : "send");
    x.fromWallet = v; x.fromCur = cur;
    if (by[cur] > 0) x.fromAmount = inNum(r2(by[cur]), 2);
    xRecalcHolder(x);
    xOpen(x);
  },
  "save-exchange": saveExchange,
  "delete-exchange": async b => { try { await S.db.doc(b.dataset.path).delete(); } catch (e) { setStatus("Не удалилось. Попробуйте ещё раз.", true); } S.pending = null; render(true); },
  "save-rates": saveRates,
  "save-pct": savePct,
  "save-sums": () => saveSums(),
  "fs-cur": (b, v) => { const f = S.form; f.cur = v; f.rate = inNum(curRate(v)); render(true); }
};

async function saveDeal() {
  const f = S.oform;
  if (!f.client.trim()) { S.msg = { where: "deal", cls: "err", text: "Укажите имя клиента." }; render(true); return; }
  if (!(f.clientCode || "").trim()) { S.msg = { where: "deal", cls: "err", text: "Укажите код клиента." }; render(true); return; }
  const uid = S.isOwner ? (f.mgr || S.myId) : S.myId;
  const code = newCode();
  const body = { code, client: f.client.trim().slice(0, 120), clientCode: f.clientCode.trim().slice(0, 60), status: "payment", closedDate: null, moscowDate: null, createdBy: S.myId, createdAt: Date.now(), updatedAt: Date.now() };
  try {
    await S.db.doc(`deals/${uid}/orders/${code}`).set(body);
    S.oform = null; S.msg = null; S.open = { uid, id: code }; render(true); window.scrollTo(0, 0);
    /* Сразу открываем первый пункт: сумма поставщика и сумма клиенту */
    setTimeout(() => HANDLERS["open-form"](null, "sums"), 60);
  } catch (e) { S.msg = { where: "deal", cls: "err", text: "Сделка не сохранилась. Проверьте интернет и попробуйте ещё раз." }; render(true); }
}
async function saveEditDeal() {
  const f = S.editOrder;
  if (!f.client.trim()) return;
  try {
    await S.db.doc(`deals/${S.open.uid}/orders/${S.open.id}`).update({ client: f.client.trim().slice(0, 120), clientCode: f.clientCode.trim().slice(0, 60), updatedAt: Date.now() });
    S.editOrder = null; render(true);
  } catch (e) { setStatus("Не сохранилось. Попробуйте ещё раз.", true); }
}
async function setStage(v) {
  const { uid, id } = S.open; const o = findOrder(uid, id);
  if (!o || o.status === v) { S.pending = null; render(true); return; }
  const upd = { status: v, updatedAt: Date.now() };
  upd.closedDate = v === "done" ? (o.closedDate || today()) : null;
  /* Дата приезда в Москву — от неё считается процент менеджеру */
  const reached = v !== "cancelled" && STAGE_IDX[v] >= STAGE_IDX.moscow;
  upd.moscowDate = reached ? (o.moscowDate || today()) : null;
  S.pending = null;
  try { await S.db.doc(`deals/${uid}/orders/${id}`).update(upd); }
  catch (e) { setStatus("Этап не сохранился. Попробуйте ещё раз.", true); }
  render(true);
}
async function deleteDeal() {
  const { uid, id } = S.open;
  const list = orderEntries(uid, id);
  try {
    for (const e of list) {
      await S.db.doc(`deals/${uid}/entries/${e.id}`).delete();
      if (e.receipt && S.assets) S.assets.delete(e.receipt).catch(() => {});
    }
    await S.db.doc(`deals/${uid}/orders/${id}`).delete();
    S.open = null; S.pending = null; render(true);
  } catch (e) { setStatus("Сделка удалилась не полностью. Попробуйте ещё раз.", true); }
}
async function saveEntry() {
  const f = S.form;
  const fail = t => { S.msg = { where: "form", cls: "err", text: t }; render(true); };
  const amount = num(f.amount);
  if (!f.cat) return fail("Выберите, за что.");
  if (!(amount > 0)) return fail("Введите сумму больше нуля.");
  let rate = 1, cny = amount, applied = null;
  if (crossNeeded(f)) {
    /* Оплата в другой валюте, чем счёт: засчитываем по кросс-курсу, в юани — по текущему курсу */
    if (!(num(f.xr) > 0)) return fail("Укажите курс, по которому клиент платит.");
    applied = toApplied(f, amount);
    if (f.cur !== "CNY") {
      rate = curRate(f.cur);
      cny = rate > 0 ? toCny(amount, f.cur, rate) : applied * f.inv.k;
      if (!(rate > 0)) rate = rateFrom(amount, f.cur, cny);
    }
  } else if (f.cur !== "CNY") {
    rate = num(f.rate); cny = num(f.cny);
    if (!(rate > 0) && cny > 0) rate = rateFrom(amount, f.cur, cny);
    if (!(rate > 0)) return fail("Укажите курс или сколько юаней получили.");
    cny = toCny(amount, f.cur, rate);
  }
  if (f.kind === "income" && f.inv && applied == null) applied = amount;
  if (!f.date) return fail("Укажите дату.");
  if (canBill(f) && f.cat === MSK && f.bill == null) return fail("Выберите, кто оплачивает расходы по Москве: клиент или мы.");
  if (canBill(f) && f.bill && !(num(f.billAmount) > 0)) return fail("Укажите, сколько выставить клиенту.");
  const btn = document.getElementById("f-save"); if (btn) btn.disabled = true;
  const body = { kind: f.kind === "general" ? "general" : f.kind, cat: f.cat, amount: r2(amount), cur: f.cur, rate: +rate.toFixed(6), cny: r2(cny), date: f.date, method: f.kind === "charge" || f.kind === "plan" ? null : f.method, note: f.note.trim().slice(0, 300), receipt: f.receipt || null, receiptType: f.receiptType || null, applied: applied != null && isFinite(applied) ? r2(applied) : null, applyCur: applied != null && f.inv ? f.inv.cur : null, updatedAt: Date.now() };
  if (f.ctx === "deal") body.orderId = f.orderId;
  try {
    if (f.file && S.assets) {
      if (f.file.size > 20 * 1024 * 1024) return fail("Файл больше 20 МБ. Сделайте скриншот и прикрепите его.");
      try {
        const up = await S.assets.upload(f.file);
        body.receipt = up.id; body.receiptType = up.contentType;
      } catch (err) {
        if (btn) btn.disabled = false;
        return fail(err?.code === "unsupported_type" ? "Такой формат не поддерживается. Прикрепите JPG, PNG или PDF." : "Чек не загрузился. Попробуйте ещё раз или сохраните без чека.");
      }
    }
    const col = f.ctx === "general" ? "company/main/general" : `deals/${f.uid}/entries`;
    if (f.mode === "edit") await S.db.doc(`${col}/${f.id}`).update(body);
    else {
      body.createdBy = S.myId; body.createdAt = Date.now(); await S.db.collection(col).doc().set(body);
      /* Образец или прочий расход на товар выставлен клиенту — добавляем к счёту за товар.
         Расходы по Москве, которые оплачивает клиент, — отдельный счёт «Расходы по Москве» в рублях */
      if (canBill(f) && f.bill && num(f.billAmount) > 0) {
        const ba = num(f.billAmount), bc = f.billCur;
        let br = bc === "CNY" ? 1 : (sameMoney(bc, f.cur) ? body.rate : (curRate(bc) > 0 ? curRate(bc) : NaN));
        if (!(br > 0)) br = rateFrom(ba, bc, body.cny); /* курса нет — считаем, что выставили по стоимости расхода */
        const isMsk = f.cat === MSK;
        await S.db.collection(col).doc().set({ orderId: f.orderId, kind: "charge", cat: isMsk ? MSK : f.cat === "Образец" ? "Образец" : "Товар", amount: r2(ba), cur: bc, rate: +br.toFixed(6), cny: r2(toCny(ba, bc, br)), date: f.date, method: null, note: (isMsk ? body.note : `выставлено за: ${f.cat.toLowerCase()}${body.note ? " · " + body.note : ""}`).slice(0, 300), receipt: null, receiptType: null, createdBy: S.myId, createdAt: Date.now(), updatedAt: Date.now() });
      }
    }
    const billed = f.mode !== "edit" && canBill(f) ? (f.bill && num(f.billAmount) > 0 ? ` · выставлено клиенту ${money(num(f.billAmount), f.billCur)}` : " · за наш счёт") : "";
    const what = `${f.mode === "edit" ? "Изменено" : "Сохранено"}: ${f.cat}, ${money(amount, f.cur)}${billed}`;
    S.form = null; S.pending = null; S.msg = { where: "entry", cls: "ok", text: what };
    render(true);
  } catch (err) {
    fail(err?.code === "quota_exceeded" ? "База заполнена. Сообщите владельцу." : "Не сохранилось. Проверьте интернет и попробуйте ещё раз.");
  } finally { const b2 = document.getElementById("f-save"); if (b2) b2.disabled = false; }
}
async function deleteEntry() {
  const f = S.form;
  const col = f.ctx === "general" ? "company/main/general" : `deals/${f.uid}/entries`;
  try {
    await S.db.doc(`${col}/${f.id}`).delete();
    if (f.receipt && S.assets) S.assets.delete(f.receipt).catch(() => {});
    S.form = null; S.pending = null; S.msg = { where: "entry", cls: "ok", text: "Запись удалена" }; render(true);
  } catch (e) { S.msg = { where: "form", cls: "err", text: "Не удалилось. Попробуйте ещё раз." }; render(true); }
}
async function saveExchange() {
  const x = S.xform;
  const a = num(x.fromAmount), b = num(x.toAmount);
  const err = t => { S.msg = { where: "x", cls: "err", text: t }; render(true); };
  if (!(a > 0) || !(b > 0)) return err("Укажите, сколько отправили и сколько получили.");
  if (x.fromWallet === x.toWallet && x.fromCur === x.toCur) return err("«Откуда» и «Куда» совпадают.");
  const same = sameMoney(x.fromCur, x.toCur);
  if (same && b > a + 0.005) return err("Получили больше, чем отправили, — проверьте суммы.");
  if (!S.isOwner && WALLET[x.fromWallet].where !== "ru") return err("Переводить можно только из российских кошельков.");
  const body = { fromWallet: x.fromWallet, fromAmount: r2(a), fromCur: x.fromCur, toWallet: x.toWallet, toAmount: r2(b), toCur: x.toCur, date: x.date || today(), note: x.note.trim().slice(0, 300), createdBy: S.myId, createdAt: Date.now() };
  /* Менеджер пишет отправку в свои записи (владелец видит все), владелец — в общую кассу */
  const col = S.isOwner ? "company/main/exchanges" : `deals/${S.myId}/transfers`;
  try {
    await S.db.collection(col).doc().set(body);
    const toCn = WALLET[x.toWallet].where === "cn" && WALLET[x.fromWallet].where === "ru";
    const leftTxt = "";
    const head = toCn ? `Отправка в Китай сохранена: ${WALLET[x.fromWallet].name} −${money(a, x.fromCur)}, ${WALLET[x.toWallet].name} +${money(b, x.toCur)}.` : same ? `Перевод сохранён: ${WALLET[x.toWallet].name} +${money(b, x.toCur)}.` : "Обмен сохранён.";
    if (same || !S.isOwner) { S.xform = null; S.msg = { where: "x", cls: "ok", text: head + leftTxt }; render(true); return; }
    const upd = { ...S.rates, updatedAt: Date.now() };
    if (x.toCur === "CNY") {
      if (x.fromCur === "RUB") upd.rubPerCny = +(a / b).toFixed(4);
      if (x.fromCur === "USDT") upd.cnyPerUsdt = +(b / a).toFixed(4);
      if (x.fromCur === "USD") upd.cnyPerUsd = +(b / a).toFixed(4);
    } else if (x.toCur === "USDT" && x.fromCur === "RUB" && S.rates.cnyPerUsdt > 0) {
      upd.rubPerCny = +((a / b) / S.rates.cnyPerUsdt).toFixed(4);
    }
    await S.db.doc("rates/current").set(upd);
    S.xform = null; S.msg = { where: "x", cls: "ok", text: head + " Курс обновлён." + leftTxt }; render(true);
  } catch (e) { S.msg = { where: "x", cls: "err", text: "Не сохранилось. Попробуйте ещё раз." }; render(true); }
}
/* Курс рубля к юаню считается сам: (₽ за 1 USDT) ÷ (¥ за 1 USDT) */
function rubCalcText(v) {
  if (!(v > 0)) return `<span class="muted">Курс рубля к юаню посчитается сам, когда впишете оба курса USDT.</span>`;
  return `Курс рубля к юаню: <b>1 ¥ = ${inNum(v, 4)} ₽</b> — считается сам.${v > 30 ? ` <b class="neg">Похоже на курс доллара, а не юаня — проверьте.</b>` : ""}`;
}
async function saveRates() {
  const rubUsdt = num(document.getElementById("r-rubusdt").value), usdt = num(document.getElementById("r-usdt").value), usd = num(document.getElementById("r-usd").value);
  const rub = rubUsdt > 0 && usdt > 0 ? rubUsdt / usdt : NaN;
  if (rub > 30) { S.msg = { where: "rates", cls: "err", text: "Юань выходит дороже 30 ₽ — проверьте: «1 USDT = ? ¥» — это юани за USDT (около 7)." }; render(true); return; }
  const upd = { updatedAt: Date.now() };
  if (rub > 0) upd.rubPerCny = rub; if (usdt > 0) upd.cnyPerUsdt = usdt; if (usd > 0) upd.cnyPerUsd = usd;
  if (Object.keys(upd).length < 2) { S.msg = { where: "rates", cls: "err", text: "Укажите хотя бы один курс." }; render(true); return; }
  try { await S.db.doc("rates/current").set({ ...S.rates, ...upd }); S.msg = { where: "rates", cls: "ok", text: "Сохранено" }; }
  catch (e) { S.msg = { where: "rates", cls: "err", text: "Не сохранилось. Попробуйте ещё раз." }; }
  render(true);
}
async function savePct() {
  const v = num(document.getElementById("pct-all").value);
  if (!(v >= 0 && v <= 100)) { S.msg = { where: "pct", cls: "err", text: "Процент от 0 до 100." }; render(true); return; }
  try { await S.db.doc("rates/current").set({ ...S.rates, bonusPct: v, updatedAt: S.rates.updatedAt || Date.now() }); S.msg = { where: "pct", cls: "ok", text: `Сохранено: ${nf.format(v)}% для всех менеджеров` }; }
  catch (e) { S.msg = { where: "pct", cls: "err", text: "Не сохранилось. Попробуйте ещё раз." }; }
  render(true);
}
