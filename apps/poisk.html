function fmtTime(ms) { const o = parts(ms); return `${o.day}.${o.month} ${o.hour}:${o.minute}`; }

function dur(ms) { if (!(ms >= 0)) return "—"; const m = Math.round(ms / 6e4); if (m < 60) return `${m} ${t("min")}`; const h = Math.floor(m / 60), mm = m % 60; if (h < 48) return `${h} ${t("h")}${mm ? " " + mm + " " + t("min") : ""}`; return `${Math.floor(h / 24)} ${t("d")} ${h % 24} ${t("h")}`; }
function ago(ms) { const d = Date.now() - ms; return d < 6e4 ? t("sec") : `${dur(d)} ${t("ago")}`; }
function nameOf(uid) { if (!uid) return "—"; if (uid === S.myId) return t("you"); return S.names[uid] || t("someone"); }
function roleOf(uid) { return S.roles[uid] || "none"; }
const isRu = () => S.isOwner || S.role === "ru";
const isCn = () => S.isOwner || S.role === "cn";
function setStatus(text, warn) { const el = document.getElementById("status"); if (!text) { el.hidden = true; return; } el.hidden = false; el.className = "notice" + (warn ? " warn" : ""); el.textContent = text; }
function gate(title, text) { document.getElementById("tabs").hidden = true; document.getElementById("main").innerHTML = `<div class="gate"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`; }
const blobUrl = id => "/_blob/" + encodeURIComponent(id);
function avg(a) { return a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN; }

/* ================================================================== */
/*  Подключение                                                        */
/* ================================================================== */
async function boot() {
  const ns = window.claude;
  if (!ns || typeof ns.use !== "function") { gate("Откройте страницу в Claude", "Заявки работают внутри Claude, когда вы вошли в свой аккаунт. 请在 Claude 中打开。"); return; }
  const [db, user, assets] = await Promise.all([ns.use("db"), ns.use("user"), ns.use("assets")]);
  if (!db) { gate("Нет доступа к базе", "Войдите в аккаунт Claude и откройте ссылку снова. 请登录后重试。"); return; }
  S.db = db; S.user = user; S.assets = assets;
  ns.use("sample").then(s => { S.sample = s; }).catch(() => {});
  S.isOwner = (await user?.isOwner()) ?? false;
  S.myId = (await user?.id()) ?? null;
  if (!S.myId) { gate("Не удалось определить пользователя", "Войдите в аккаунт Claude и откройте ссылку снова."); return; }
  try { const me = await user.me(); document.getElementById("who").textContent = me.name || ""; } catch (e) {}
  /* отметка «был на странице» — по ней владелец видит человека во вкладке «Люди» */
  try { await db.doc("members/" + S.myId).set({ lastSeen: Date.now() }); } catch (e) {}

  const timer = setTimeout(() => setStatus("База пока не отвечает. Проверьте интернет. 网络连接较慢。", true), 10000);
  const onErr = () => { clearTimeout(timer); setStatus("Не удалось загрузить часть данных. Обновите страницу. 加载失败，请刷新。", true); };
  const ok = () => { clearTimeout(timer); setStatus(""); };
  db.doc("roles/main").onSnapshot(snap => { S.roles = snap.exists ? { ...snap.data() } : {}; S.role = S.isOwner ? "owner" : roleOf(S.myId); if (!LANG) LANG = S.role === "cn" ? "zh" : "ru"; refreshNames(); buildTabs(); render(true); }, onErr);
  db.collection("requests").onSnapshot(snap => { ok(); S.reqs = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshNames(); render(); }, onErr);
  db.collection("events").onSnapshot(snap => { S.events = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onErr);
  if (S.isOwner) db.collection("members").onSnapshot(snap => { S.members = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshNames(); render(); }, () => {});
  bindEvents(); buildTabs(); render(true);
}
let namesBusy = false;
async function refreshNames() {
  if (!S.user || namesBusy) return;
  const ids = new Set([...Object.keys(S.roles), ...S.members.map(m => m.id)]);
  S.reqs.forEach(r => { [r.createdBy, r.takenBy].forEach(x => x && ids.add(x)); });
  const need = [...ids].filter(id => !(id in S.names)); if (!need.length) return;
  namesBusy = true;
  try { const ps = await S.user.profiles(need.slice(0, 64)); for (const id of need) S.names[id] = (ps[id] && ps[id].name) || ""; render(); } catch (e) {}
  namesBusy = false;
}

function tabList() { return S.isOwner ? [["queue", t("queue")], ["report", t("report")], ["people", t("people")]] : [["queue", t("queue")]]; }
function buildTabs() {
  const nav = document.getElementById("tabs"); nav.hidden = tabList().length < 2;
  nav.innerHTML = tabList().map(([id, l]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${esc(l)}</button>`).join("");
  document.getElementById("h1").textContent = t("title");
  const r = document.getElementById("role"); r.hidden = false; r.textContent = S.isOwner ? t("owner") : t(S.role);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === (LANG || "ru"))));
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "ru";
}
let queued = false, force = false;
function render(f) { if (!S.db) return; if (f) force = true; if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; const ff = force; force = false; draw(ff); }); }
function draw(f) {
  const main = document.getElementById("main"), a = document.activeElement;
  if (!f && a && main.contains(a) && a.matches("input, textarea, select")) { a.addEventListener("blur", () => render(), { once: true }); return; }
  if (!S.isOwner && S.role === "none") { main.innerHTML = `<div class="gate"><h2>${esc(t("needRole"))}</h2><p>${esc(t("needRoleT"))}</p></div>`; return; }
  const y = window.scrollY;
  main.innerHTML = S.tab === "report" ? reportPage() : S.tab === "people" ? peoplePage() : S.open ? reqPage() : queuePage();
  if (!f) window.scrollTo(0, y);
}

/* ---------- очередь ---------- */
function stChip(st) { return `<span class="st" style="--st:var(${STAT[st] || "--s-off"})">${esc(t("st_" + st))}</span>`; }
function isLate(r) { return (r.status === "new" || r.status === "rework" || r.status === "work") && Date.now() - (r.status === "rework" ? (r.reworkAt || r.createdAt) : r.createdAt) > DAY; }
function filtered() {
  const f = S.filter, mine = r => r.createdBy === S.myId || r.takenBy === S.myId;
  return S.reqs.filter(r => f === "all" ? true : f === "mine" ? mine(r) : f === "review" ? r.status === "review" : f === "closed" ? ["done", "bad", "off"].includes(r.status) : ["new", "work", "rework", "review"].includes(r.status))
    .sort((a, b) => (isLate(b) - isLate(a)) || ((b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt)));
}
function reqTitle(r) { return LANG === "zh" && r.titleZh ? r.titleZh : r.title; }
function queuePage() {
  const counts = { active: 0, mine: 0, review: 0, closed: 0, all: S.reqs.length };
  for (const r of S.reqs) { if (["new", "work", "rework", "review"].includes(r.status)) counts.active++; if (r.createdBy === S.myId || r.takenBy === S.myId) counts.mine++; if (r.status === "review") counts.review++; if (["done", "bad", "off"].includes(r.status)) counts.closed++; }
  const list = filtered();
  return `<div class="list">
    ${isRu() ? (S.oform ? newForm() : `<div class="row"><button class="btn" data-act="new">${esc(t("newReq"))}</button></div>`) : ""}
    <div class="filters">${["active", "mine", "review", "closed", "all"].map(k => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${S.filter === k}">${esc(t("f_" + k))}<span class="n">${counts[k]}</span></button>`).join("")}</div>
    ${list.length ? list.map(card).join("") : `<div class="empty">${esc(S.reqs.length ? "—" : (isRu() ? "Заявок пока нет. Нажмите «Новая заявка» — она сразу появится у менеджера в Китае." : "暂无请求。俄罗斯经理创建请求后会显示在这里。"))}</div>`}
  </div>`;
}

    <div class="meta"><span>${esc(t("createdBy"))}: <b>${esc(nameOf(r.createdBy))}</b></span>${r.takenBy ? `<span>${esc(t("searcher"))}: <b>${esc(nameOf(r.takenBy))}</b></span>` : ""}<span>${esc(t("age"))}: ${esc(fmtTime(r.createdAt))}</span>${["new", "work", "rework", "review"].includes(r.status) && waitFrom ? `<span>${esc(t("wait"))}: <b>${esc(dur(Date.now() - waitFrom))}</b></span>` : ""}${r.optCount ? `<span>${esc(t("options"))}: <b>${r.optCount}</b></span>` : ""}</div>

/* ---------- отчёт ---------- */
function periodStart() { const p = S.rep.period; const today0 = Date.parse(dayKey(Date.now()) + "T00:00:00+08:00"); return p === "today" ? today0 : p === "d7" ? today0 - 6 * DAY : today0 - 29 * DAY; }
function reportPage() {
  const from = periodStart();
  const ev = S.events.filter(e => e.ts >= from);
  const people = [...new Set([...Object.keys(S.roles).filter(u => S.roles[u] === "cn"), ...S.events.filter(e => e.type === "taken").map(e => e.uid)])];
  const ruPeople = [...new Set([...Object.keys(S.roles).filter(u => S.roles[u] === "ru"), ...S.reqs.map(r => r.createdBy)])].filter(u => u && !(people.includes(u) && S.roles[u] !== "ru"));
  /* по каждому, кто ищет в Китае */
  const cnRows = people.map(uid => {
    const taken = ev.filter(e => e.uid === uid && e.type === "taken");
    const deliv = ev.filter(e => e.uid === uid && e.type === "delivered");
    const takeT = taken.map(e => { const r = S.reqs.find(x => x.id === e.reqId); const prev = S.events.filter(x => x.reqId === e.reqId && (x.type === "created" || x.type === "reworked") && x.ts <= e.ts).sort((a, b) => b.ts - a.ts)[0]; return prev ? e.ts - prev.ts : NaN; }).filter(isFinite);
    const searchT = deliv.map(e => { const prev = S.events.filter(x => x.reqId === e.reqId && x.type === "taken" && x.ts <= e.ts).sort((a, b) => b.ts - a.ts)[0]; return prev ? e.ts - prev.ts : NaN; }).filter(isFinite);
    const reviewed = ev.filter(e => ["accepted", "rejected", "reworked"].includes(e.type) && S.reqs.find(r => r.id === e.reqId)?.takenBy === uid);
    const okFirst = reviewed.filter(e => e.type === "accepted" && !(S.reqs.find(r => r.id === e.reqId)?.reworks)).length;
    const rework = reviewed.filter(e => e.type === "reworked").length;
    return { uid, taken: taken.length, deliv: deliv.length, takeT: avg(takeT), searchT: avg(searchT), okFirst, reviewed: reviewed.filter(e => e.type !== "reworked").length, rework };
  });
  const ruRows = ruPeople.map(uid => {
    const created = ev.filter(e => e.uid === uid && e.type === "created").length;
    const revT = ev.filter(e => e.uid === uid && ["accepted", "rejected", "reworked"].includes(e.type)).map(e => { const prev = S.events.filter(x => x.reqId === e.reqId && x.type === "delivered" && x.ts <= e.ts).sort((a, b) => b.ts - a.ts)[0]; return prev ? e.ts - prev.ts : NaN; }).filter(isFinite);
    return { uid, created, revT: avg(revT) };
  });
  const now = { q: S.reqs.filter(r => r.status === "new" || r.status === "rework").length, w: S.reqs.filter(r => r.status === "work").length, rv: S.reqs.filter(r => r.status === "review").length };
  const late = S.reqs.filter(isLate);
  if (!S.rep.day) S.rep.day = dayKey(Date.now());
  if (!S.rep.person && people.length) S.rep.person = people[0];
  return `<div class="list">
    <section class="card"><h2>${esc(t("nowT"))}</h2>
      <div class="kpis">
        <div class="kpi"><span class="k">${esc(t("inQueue"))}</span><span class="v">${now.q}</span></div>
        <div class="kpi"><span class="k">${esc(t("inWork"))}</span><span class="v">${now.w}</span></div>
        <div class="kpi"><span class="k">${esc(t("toReview"))}</span><span class="v">${now.rv}</span></div>
        <div class="kpi"><span class="k">${esc(t("lateList"))}</span><span class="v ${late.length ? "neg" : "pos"}">${late.length}</span></div>
      </div>
      ${late.length ? `<div class="list">${late.map(card).join("")}</div>` : ""}
    </section>
    <section class="card">
      <div class="row"><h2>${esc(t("cn"))}</h2><span class="spacer"></span><div class="filters">${["today", "d7", "d30"].map(k => `<button class="chip" data-act="period" data-v="${k}" aria-pressed="${S.rep.period === k}">${esc(t(k))}</button>`).join("")}</div></div>
      ${cnRows.length ? cnRows.map(x => `<div style="display:grid;gap:8px"><b>${esc(nameOf(x.uid))}</b><div class="kpis">
        <div class="kpi"><span class="k">${esc(t("rTaken"))}</span><span class="v">${x.taken}</span></div>
        <div class="kpi"><span class="k">${esc(t("rDelivered"))}</span><span class="v">${x.deliv}</span></div>
        <div class="kpi"><span class="k">${esc(t("rTakeT"))}</span><span class="v">${esc(dur(x.takeT))}</span></div>
        <div class="kpi"><span class="k">${esc(t("rSearchT"))}</span><span class="v">${esc(dur(x.searchT))}</span></div>
        <div class="kpi"><span class="k">${esc(t("rOk"))}</span><span class="v">${x.reviewed ? `${x.okFirst} / ${x.reviewed}` : "—"}</span><span class="x">оценено заявок</span></div>
        <div class="kpi"><span class="k">${esc(t("rRework"))}</span><span class="v ${x.rework ? "warn" : ""}">${x.rework}</span></div>
      </div></div>`).join("") : `<div class="empty">Назначьте менеджеру в Китае роль во вкладке «Люди».</div>`}
      ${ruRows.length ? `<div class="tbl"><table><thead><tr><th>${esc(t("ru"))}</th><th class="num">${esc(t("rCreated"))}</th><th class="num">${esc(t("rReviewT"))}</th></tr></thead><tbody>
        ${ruRows.map(x => `<tr><td><b>${esc(nameOf(x.uid))}</b></td><td class="num">${x.created}</td><td class="num">${esc(dur(x.revT))}</td></tr>`).join("")}
      </tbody></table></div>` : ""}
    </section>
    ${dayCard([...people, ...ruPeople])}
  </div>`;
}
function dayCard(all) {
  const uid = S.rep.person, day = S.rep.day;
  const ev = S.events.filter(e => e.uid === uid && dayKey(e.ts) === day).sort((a, b) => a.ts - b.ts);
  const per = Array(24).fill(0); ev.forEach(e => per[hourOf(e.ts)]++);
  let gap = 0, gFrom = 0, gTo = 0; for (let i = 1; i < ev.length; i++) { const g = ev[i].ts - ev[i - 1].ts; if (g > gap) { gap = g; gFrom = ev[i - 1].ts; gTo = ev[i].ts; } }
  return `<section class="card"><h2>${esc(t("dayT"))}</h2><p class="sub">${esc(t("dayHint"))}</p>
    <div class="grid"><div class="f"><label for="d-person">${esc(t("people"))}</label><select id="d-person" data-act="d-person">${all.map(u => `<option value="${esc(u)}" ${u === uid ? "selected" : ""}>${esc(nameOf(u))} · ${esc(t(roleOf(u)))}</option>`).join("")}</select></div>
    <div class="f"><label for="d-day">Дата / 日期</label><input id="d-day" type="date" data-act="d-day" value="${esc(day)}"></div></div>
    <div class="hours">${per.map(n => `<div class="c ${n >= 2 ? "on" : n ? "on2" : ""}" title="${n}">${n ? `<span>${n}</span>` : ""}</div>`).join("")}</div>
    <div class="hlab">${per.map((_, h) => `<span>${h % 3 === 0 ? h : ""}</span>`).join("")}</div>
    ${ev.length ? `<dl class="kv"><dt>${esc(t("first"))}</dt><dd><b>${esc(fmtHM(ev[0].ts))}</b></dd><dt>${esc(t("last"))}</dt><dd><b>${esc(fmtHM(ev[ev.length - 1].ts))}</b></dd>${ev.length > 1 ? `<dt>${esc(t("gap"))}</dt><dd><b class="${gap > 2 * H ? "warn" : ""}">${esc(dur(gap))}</b> · ${esc(fmtHM(gFrom))}–${esc(fmtHM(gTo))}</dd>` : ""}</dl>
      <div class="log">${ev.map(e => { const r = S.reqs.find(x => x.id === e.reqId); return `<div class="e"><span class="t">${esc(fmtHM(e.ts))}</span><span>${esc(t(e.type))} — <button class="link" data-act="open-from-rep" data-id="${esc(e.reqId)}">${esc((r && reqTitle(r)) || "—")}</button></span></div>`; }).join("")}</div>`
      : `<div class="empty">${esc(t("noActs"))}</div>`}
  </section>`;
}

/* ---------- люди ---------- */
function peoplePage() {
  const ids = [...new Set([...S.members.map(m => m.id), ...Object.keys(S.roles)])].filter(id => id !== S.myId);
  const seen = Object.fromEntries(S.members.map(m => [m.id, m.lastSeen]));
  return `<section class="card"><h2>${esc(t("peopleT"))}</h2><p class="sub">${esc(t("peopleSub"))} Поделитесь ссылкой на эту страницу с менеджерами (меню «Поделиться», право вносить изменения).</p>
    ${ids.length ? `<div class="tbl"><table><tbody>${ids.map(id => `<tr><td><b>${esc(nameOf(id))}</b><div class="small muted">${seen[id] ? `${esc(t("lastSeen"))}: ${esc(fmtTime(seen[id]))}` : ""}</div></td>
      <td style="width:190px"><select data-act="set-role" data-uid="${esc(id)}" aria-label="Роль">${["none", "ru", "cn"].map(r => `<option value="${r}" ${roleOf(id) === r ? "selected" : ""}>${esc(TX.ru[r])}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">Пока никто, кроме вас, страницу не открывал.</div>`}
    <span class="status ${S.msg?.where === "people" ? S.msg.cls : ""}" role="status">${S.msg?.where === "people" ? esc(S.msg.text) : ""}</span>
  </section>`;
}

/* ================================================================== */
/*  Действия                                                           */
/* ================================================================== */
async function logEvent(reqId, type, note) { await S.db.collection("events").doc().set({ reqId, type, uid: S.myId, ts: Date.now(), ...(note ? { note: note.slice(0, 300) } : {}) }); }
async function uploadFiles(input, max) {
  if (!S.assets || !input || !input.files || !input.files.length) return [];
  const out = []; for (const file of [...input.files].slice(0, max)) { const r = await S.assets.upload(file); out.push(r.id); } return out;
}
function openReq(id) {
  if (S.optUnsub) { try { S.optUnsub(); } catch (e) {} S.optUnsub = null; }
  S.open = id; S.opts = []; S.form = null; S.why = null; S.msg = null;
  if (id) S.optUnsub = S.db.collection(`requests/${id}/options`).onSnapshot(snap => { S.opts = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  render(true); window.scrollTo(0, 0);
}
async function setReq(id, upd) { await S.db.doc("requests/" + id).update({ ...upd, updatedAt: Date.now() }); }
async function act(fn, where) { if (S.busy) return; S.busy = true; render(true); try { await fn(); } catch (e) { S.msg = { where, cls: "err", text: t("errSave") }; } finally { S.busy = false; render(true); } }

const HANDLERS = {
  new: () => { S.oform = { title: "", code: "", qty: "", price: "", details: "", link: "" }; S.msg = null; render(true); setTimeout(() => document.getElementById("n-what")?.focus(), 30); },
  "close-new": () => { S.oform = null; render(true); },
  filter: (b, v) => { S.filter = v; render(true); },
  open: (b) => openReq(b.dataset.id),
  "open-from-rep": (b) => { S.tab = "queue"; buildTabs(); openReq(b.dataset.id); },
  back: () => openReq(null),
  create: () => {
    const f = S.oform; if (!f.title.trim()) { S.msg = { where: "new", cls: "err", text: t("errWhat") }; render(true); return; }
    const input = document.getElementById("n-photos");
    act(async () => {
      if (input && input.files.length) { S.msg = { where: "new", cls: "", text: t("upload") }; render(true); }
      const photos = await uploadFiles(input, 6);
      const ref = S.db.collection("requests").doc(); const now = Date.now();
      await ref.set({ title: f.title.trim().slice(0, 200), code: f.code.trim().slice(0, 60), qty: f.qty.trim().slice(0, 80), price: f.price.trim().slice(0, 80), details: f.details.trim().slice(0, 2000), link: f.link.trim().slice(0, 500), photos, status: "new", createdBy: S.myId, createdAt: now, updatedAt: now, reworks: 0, optCount: 0 });
      await logEvent(ref.id, "created");
      S.oform = null; S.msg = null;
    }, "new");
  },
  take: () => act(async () => { const r = S.reqs.find(x => x.id === S.open); await setReq(r.id, { status: "work", takenBy: S.myId, takenAt: r.takenAt || Date.now() }); await logEvent(r.id, "taken"); S.msg = null; }, "req"),
  "add-opt": () => { S.form = { title: "", price: "", moq: "", lead: "", link: "", note: "" }; S.msg = null; render(true); setTimeout(() => document.getElementById("o-title")?.focus(), 30); },
  "close-opt": () => { S.form = null; render(true); },
  "save-opt": () => {
    const f = S.form; if (!f.title.trim()) { S.msg = { where: "opt", cls: "err", text: t("errOpt") }; render(true); return; }
    const input = document.getElementById("o-photo"), id = S.open;
    act(async () => {
      const [photo] = await uploadFiles(input, 1);
      await S.db.collection(`requests/${id}/options`).doc().set({ title: f.title.trim().slice(0, 200), price: f.price.trim().slice(0, 60), moq: f.moq.trim().slice(0, 60), lead: f.lead.trim().slice(0, 60), link: f.link.trim().slice(0, 500), note: f.note.trim().slice(0, 1500), photo: photo || null, createdBy: S.myId, createdAt: Date.now() });
      const r = S.reqs.find(x => x.id === id); await setReq(id, { optCount: (r.optCount || 0) + 1 });
      await logEvent(id, "optAdded", f.title.trim());
      S.form = null; S.msg = { where: "req", cls: "ok", text: t("saved") };
    }, "opt");
  },
  "del-opt": (b) => act(async () => { const id = S.open; await S.db.doc(`requests/${id}/options/${b.dataset.id}`).delete(); const r = S.reqs.find(x => x.id === id); await setReq(id, { optCount: Math.max(0, (r.optCount || 1) - 1) }); }, "req"),
  deliver: () => {
    if (!S.opts.length) { S.msg = { where: "req", cls: "err", text: t("errNoOpt") }; render(true); return; }
    act(async () => { await setReq(S.open, { status: "review", deliveredAt: Date.now() }); await logEvent(S.open, "delivered"); S.msg = null; }, "req");
  },
  why: (b, v) => { S.why = { kind: v, text: "" }; render(true); setTimeout(() => document.getElementById("why")?.focus(), 30); },
  "why-close": () => { S.why = null; render(true); },
  review: (b, v) => {
    const text = S.why?.text?.trim() || "";
    if (v === "rework" && !text) { document.getElementById("why")?.focus(); return; }
    act(async () => {
      const r = S.reqs.find(x => x.id === S.open), now = Date.now();
      if (v === "done") { await setReq(r.id, { status: "done", reviewedAt: now, closedAt: now }); await logEvent(r.id, "accepted"); }
      else if (v === "bad") { await setReq(r.id, { status: "bad", reviewedAt: now, closedAt: now, comment: text, commentZh: "" }); await logEvent(r.id, "rejected", text); }
      else { await setReq(r.id, { status: "rework", reviewedAt: now, reworkAt: now, reworks: (r.reworks || 0) + 1, comment: text, commentZh: "" }); await logEvent(r.id, "reworked", text); }
      S.why = null; S.msg = null;
    }, "req");
  },
  "cancel-req": () => act(async () => { await setReq(S.open, { status: "off", closedAt: Date.now() }); await logEvent(S.open, "cancelled"); }, "req"),
  period: (b, v) => { S.rep.period = v; render(true); },
  "tr-req": () => translate("req"),
  "tr-comment": () => translate("comment"),
  "tr-opt": (b) => translate("opt", b.dataset.id)
};

/* Перевод через Claude: заявку — на китайский для менеджера в Китае, варианты — на русский */
async function translate(kind, optId) {
  if (!S.sample || S.trBusy) return;
  const r = S.reqs.find(x => x.id === S.open); if (!r) return;
  S.trBusy = kind === "opt" ? optId : kind; render(true);
  try {
    if (kind === "req") {
      const out = await S.sample.json(`Переведи заявку на поиск товара с русского на упрощённый китайский для закупщика в Китае. Сохрани числа, размеры и названия брендов. Верни JSON {"title": "...", "details": "..."} без пояснений.\n\nНазвание: ${r.title}\nКоличество: ${r.qty || "-"}\nЖелаемая цена: ${r.price || "-"}\nПодробности: ${r.details || "-"}`);
      const details = [out.details, r.qty ? `数量: ${r.qty}` : "", r.price ? `期望价格: ${r.price}` : ""].filter(Boolean).join("\n");
      await setReq(r.id, { titleZh: String(out.title || "").slice(0, 300), detailsZh: details.slice(0, 3000) });
    } else if (kind === "comment") {
      const out = await S.sample.json(`Переведи комментарий менеджера закупщику с русского на упрощённый китайский. Верни JSON {"text": "..."}.\n\n${r.comment}`);
      await setReq(r.id, { commentZh: String(out.text || "").slice(0, 1000) });
    } else {
      const o = S.opts.find(x => x.id === optId); if (!o) return;
      const out = await S.sample.json(`Переведи найденный вариант товара с китайского на русский. Сохрани числа. Верни JSON {"title": "...", "note": "..."}.\n\nНазвание: ${o.title}\nКомментарий: ${o.note || "-"}`);
      await S.db.doc(`requests/${r.id}/options/${optId}`).update({ titleRu: String(out.title || "").slice(0, 300), noteRu: String(out.note || "").slice(0, 2000) });
    }
  } catch (e) { S.msg = { where: "req", cls: "err", text: t("trNo") }; }
  finally { S.trBusy = ""; render(true); }
}

function bindEvents() {
  document.addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; S.msg = null; buildTabs(); if (S.tab !== "queue") openReq(null); else render(true); return; }
    const lb = e.target.closest("[data-lang]"); if (lb) { LANG = lb.dataset.lang; try { localStorage.setItem("tw-search-lang", LANG); } catch (er) {} buildTabs(); render(true); return; }
    const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
    const h = HANDLERS[b.dataset.act]; if (h) { e.preventDefault(); h(b, b.dataset.v); }
  });
  document.addEventListener("input", e => {
    const el = e.target, bind = el.dataset.bind; if (!bind) return;
    const [obj, key] = bind.split("."); if (S[obj]) S[obj][key] = el.value;
  });
  document.addEventListener("change", async e => {
    const el = e.target;
    if (el.dataset.act === "d-person") { S.rep.person = el.value; render(true); }
    else if (el.dataset.act === "d-day") { S.rep.day = el.value || dayKey(Date.now()); render(true); }
    else if (el.dataset.act === "set-role") {
      const roles = { ...S.roles }; if (el.value === "none") delete roles[el.dataset.uid]; else roles[el.dataset.uid] = el.value;
      try { await S.db.doc("roles/main").set(roles); S.msg = { where: "people", cls: "ok", text: `${t("saved")}: ${nameOf(el.dataset.uid)} — ${TX.ru[el.value]}` }; }
      catch (er) { S.msg = { where: "people", cls: "err", text: t("errSave") }; }
      render(true);
    }
  });
  document.addEventListener("submit", e => e.preventDefault());
  setInterval(() => render(), 60000); /* «ждёт N мин» и «без ответа > 24 ч» обновляются сами */
}

boot();
</script>
